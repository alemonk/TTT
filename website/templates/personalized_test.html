<!DOCTYPE html>
<html>
<head>
    <title>Personalized Test</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .progress-bar {
            height: 20px;
            background-color: #007bff;
        }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block title %}Personalized Test{% endblock %}
    {% block content %}

    <br />
    <h3 align="center">Personalized Test</h3>

    <br />
    <div align="center">
        <!-- Difficulty slider -->
        <p>Difficulty:</p>
        <input type="range" min="1" max="3" value="2" class="slider" id="difficultySlider">
        <p><span id="difficulty"></span></p>

        <!-- Number of open questions slider -->
        <p>Number of open questions:</p>
        <input type="range" min="0" max="10" value="1" class="slider" id="numOpenQuestionsSlider">
        <p><span id="numOpenQuestions"></span></p>

        <!-- Number of true or false questions slider -->
        <p>Number of true or false questions:</p>
        <input type="range" min="0" max="10" value="1" class="slider" id="numTrueFalseQuestionsSlider">
        <p><span id="numTrueFalseQuestions"></span></p>

        <!-- Number of closed questions slider -->
        <p>Number of closed questions:</p>
        <input type="range" min="0" max="10" value="1" class="slider" id="numClosedQuestionsSlider">
        <p><span id="numClosedQuestions"></span></p>

        <!-- Create test button -->
        <button type="button" class="btn btn-primary" id="createTestButton">
            Create Test
        </button>
    </div>

    <!-- Output divs -->
    <br />
    <div id="output" style="margin-top: 10px; text-align: left;"></div>

<script>
let difficultySlider = document.getElementById("difficultySlider");
let difficultyOutput = document.getElementById("difficulty");
difficultyOutput.innerHTML = difficultySlider.value == 1 ? "Easy" : (difficultySlider.value == 2 ? "Medium" : "Hard");

difficultySlider.oninput = function() {
    difficultyOutput.innerHTML = this.value == 1 ? "Easy" : (this.value == 2 ? "Medium" : "Hard");
}

let numOpenQuestionsSlider = document.getElementById("numOpenQuestionsSlider");
let numOpenQuestionsOutput = document.getElementById("numOpenQuestions");
numOpenQuestionsOutput.innerHTML = numOpenQuestionsSlider.value;

numOpenQuestionsSlider.oninput = function() {
    numOpenQuestionsOutput.innerHTML = this.value;
}

let numTrueFalseQuestionsSlider = document.getElementById("numTrueFalseQuestionsSlider");
let numTrueFalseQuestionsOutput = document.getElementById("numTrueFalseQuestions");
numTrueFalseQuestionsOutput.innerHTML = numTrueFalseQuestionsSlider.value;

numTrueFalseQuestionsSlider.oninput = function() {
    numTrueFalseQuestionsOutput.innerHTML = this.value;
}

let numClosedQuestionsSlider = document.getElementById("numClosedQuestionsSlider");
let numClosedQuestionsOutput = document.getElementById("numClosedQuestions");
numClosedQuestionsOutput.innerHTML = numClosedQuestionsSlider.value;

numClosedQuestionsSlider.oninput = function() {
    numClosedQuestionsOutput.innerHTML = this.value;
}

// Clear the content of the output div element
function clearOutput() {
    document.getElementById('output').innerHTML = '';
}

// Create answer buttons and append them to the container div element
function createAnswerButtons(answers, containerDiv) {
    for (var i = 0; i < answers.length; i++) {
        var answerButton = document.createElement('button');
        answerButton.type = 'button';
        answerButton.className = 'btn btn-primary';
        answerButton.style.marginRight = '5px';
        answerButton.textContent = answers[i].label;
        answerButton.style.backgroundColor = answers[i].color;
        containerDiv.appendChild(answerButton);
    }
}

// Add an event listener to the createTestButton element
document.getElementById('createTestButton').addEventListener('click', function() {
    clearOutput();

    let difficulty = document.getElementById("difficulty").innerHTML;
    let numOpenQuestions = parseInt(document.getElementById("numOpenQuestions").innerHTML);
    let numTrueFalseQuestions = parseInt(document.getElementById("numTrueFalseQuestions").innerHTML);
    let numClosedQuestions = parseInt(document.getElementById("numClosedQuestions").innerHTML);
    let numQuestions = numOpenQuestions + numTrueFalseQuestions + numClosedQuestions;

    let questionTypes = ['open question', 'true or false', 'closed question'];
    let numQuestionTypesPerType = [numOpenQuestions, numTrueFalseQuestions, numClosedQuestions];

    // Create a container div element for the progress bar
    var containerDiv = document.createElement('div');
    containerDiv.style.display = 'block';
    containerDiv.style.width = '100%';

    // Create a progress bar element
    var progressBar = document.createElement('div');
    progressBar.className = 'progress-bar';
    progressBar.role = 'progressbar';
    progressBar.style.width = '0%';

    containerDiv.appendChild(progressBar);

    // Create a progress text element
    var progressText = document.createElement('p');
    progressText.textContent = '0/' + numQuestions;
    containerDiv.appendChild(progressText);

    var outputDiv = document.getElementById('output');
    outputDiv.appendChild(containerDiv);

    let numQuestionsGenerated = 0;

    // Create an array to store the generated questions
    let generated_questions = [];

    for (let i = 0; i < questionTypes.length; i++) {
        let type_of_question = questionTypes[i];
        let numQuestionsPerType = numQuestionTypesPerType[i];

        for (let j=0; j < numQuestionTypesPerType[i]; j++) {
            fetch('/question', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({difficulty: difficulty, type_of_question: type_of_question})
            })
                .then(response => response.json())
                .then(data => {
                    // Update the progress bar and text
                    numQuestionsGenerated++;
                    let progressPercentage = Math.floor((numQuestionsGenerated / numQuestionTypesPerType.reduce((a, b) => parseInt(a) + parseInt(b), 0)) * 100);
                    progressBar.style.width = progressPercentage + '%';
                    progressText.textContent = numQuestionsGenerated + '/' + (numQuestionTypesPerType.reduce((a, b) => parseInt(a) + parseInt(b), 0));

                    // Add the generated question to the generated_questions array
                    generated_questions.push(data);

                    // Check if all questions have been generated
                    if (numQuestionTypesPerType.reduce((a, b) => parseInt(a) + parseInt(b), 0) == generated_questions.length) {
                        // All questions have been generated, so display them on the page
                        for (let k=0; k < generated_questions.length; k++) {
                            let data=generated_questions[k];

                            // Create a container div element for the question and answer
                            var containerDiv=document.createElement('div');
                            containerDiv.style.display='block';
                            containerDiv.style.borderStyle='solid';
                            containerDiv.style.borderWidth='1px';
                            containerDiv.style.borderColor='#007bff';
                            containerDiv.style.padding='10px';
                            containerDiv.style.marginBottom='10px';
                            outputDiv.appendChild(containerDiv);

                            // Create a p element for the question
                            var questionP=document.createElement('p');
                            questionP.textContent=data.question;
                            containerDiv.appendChild(questionP);

                            if (type_of_question=='open question') {
                                // Create a textarea element for user input
                                var textarea=document.createElement('textarea');
                                textarea.rows=4;
                                textarea.cols=50;
                                containerDiv.appendChild(textarea);

                                // Create a submit button for user input
                                var submitButton=document.createElement('button');
                                submitButton.type='button';
                                submitButton.className='btn btn-primary';
                                submitButton.style.marginTop='10px';
                                submitButton.textContent='Submit';
                                containerDiv.appendChild(submitButton);

                                // Add an event listener to the submit button
                                submitButton.addEventListener('click', function() {
                                    var guess=textarea.value;
                                    var question=data.question;
                                    var answer=data.answer;
                                    fetch('/check_open_question', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify({ guess: guess, question: question, answer: answer })
                                    })
                                        .then(response => response.json())
                                        .then(data => {
                                            var answerP = document.createElement('p');
                                            answerP.textContent = data.response;
                                            containerDiv.appendChild(answerP);
                                        });
                                });
                            } else if (type_of_question == 'true or false') {
                                // Create answer buttons
                                var answers = [
                                    { label: 'True', color: '#007bff' },
                                    { label: 'False', color: '#007bff' }
                                ];
                                createAnswerButtons(answers, containerDiv);

                                // Add an event listener to the answer buttons
                                var answerButtons = containerDiv.querySelectorAll('button');
                                for (var i = 0; i < answerButtons.length; i++) {
                                    answerButtons[i].addEventListener('click', function() {
                                        var guess = this.textContent;
                                        if (data.answer.startsWith(guess)) {
                                            this.style.backgroundColor = '#28a745';
                                            var answerP = document.createElement('p');
                                            answerP.textContent = 'Correct! ' + data.answer;
                                            containerDiv.appendChild(answerP);
                                        } else {
                                            this.style.backgroundColor = '#dc3545';
                                            var answerP = document.createElement('p');
                                            answerP.textContent = 'Incorrect. The correct answer is ' + data.answer + '.';
                                            containerDiv.appendChild(answerP);
                                        }
                                    });
                                }
                            } else if (type_of_question == 'closed question') {
                                // Create answer buttons
                                var answers = [
                                    { label: 'A', color: '#007bff' },
                                    { label: 'B', color: '#007bff' },
                                    { label: 'C', color: '#007bff' },
                                    { label: 'D', color: '#007bff' }
                                ];
                                createAnswerButtons(answers, containerDiv);

                                // Add an event listener to the answer buttons
                                var answerButtons = containerDiv.querySelectorAll('button');
                                for (var i = 0; i < answerButtons.length; i++) {
                                    answerButtons[i].addEventListener('click', function() {
                                        var guess = this.textContent;
                                        if (data.answer.startsWith(guess)) {
                                            this.style.backgroundColor = '#28a745';
                                            var answerP = document.createElement('p');
                                            answerP.textContent = 'Correct! ' + data.answer;
                                            containerDiv.appendChild(answerP);
                                        } else {
                                            this.style.backgroundColor = '#dc3545';
                                            var answerP = document.createElement('p');
                                            answerP.textContent = 'Incorrect. The correct answer is ' + data.answer + '.';
                                            containerDiv.appendChild(answerP);
                                        }
                                    });
                                }
                            }
                        }
                    }
                });
        }
    }
});

</script>
{% endblock %}
</body>
</html>
