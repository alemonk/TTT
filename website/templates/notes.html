{% extends "base.html" %}
{% block content %}

<h3 align="center">Notes</h3>
<br />

<div class="drop-area">
  <p>Drag and drop files here</p>
</div>

<br />

<ul class="list-group list-group-flush" id="notes">
    {% for note in user.notes %}
    <li class="list-group-item">
        <div class="note-title" onclick="toggleNoteContent(this, {{ note.id }})">
            {{ note.title }}
        </div>
        <div class="note-content" style="display: none;">
        </div>
        <button type="button" class="close" onclick="deleteNote({{ note.id }})">
            <span aria-hidden="true">×</span>
        </button>
    </li>
    {% endfor %}
</ul>

<script>
    const dropArea = document.querySelector('.drop-area');

dropArea.addEventListener('dragover', (event) => {
  event.preventDefault();
});

window.addEventListener("dragover",function(e){
  e = e || event;
  e.preventDefault();
},false);
window.addEventListener("drop",function(e){
  e = e || event;
  e.preventDefault();
},false);

dropArea.addEventListener('drop', (event) => {
  event.preventDefault();
  const files = event.dataTransfer.files;
  handleFiles(files);
});

function handleFiles(files) {
  for (const file of files) {
    const reader = new FileReader();
    reader.readAsText(file);
    reader.onload = () => {
      const title = file.name;
      const data = reader.result;
      createNote(title, data);
    };
  }
}

function createNote(title, data) {
  const formData = new FormData();
  formData.append('title', title);
  formData.append('data', data);

  fetch('/notes', {
    method: 'POST',
    body: formData
  }).then(response => response.json())
    .then(note => {
      const noteList = document.querySelector('#notes');
      const li = document.createElement('li');
      li.className = 'list-group-item';
      li.innerHTML = `
        <div class="note-title" onclick="toggleNoteContent(this, ${note.id})">
          ${note.title}
        </div>
        <div class="note-content" style="display: none;">
        </div>
        <button type="button" class="close" onclick="deleteNote(${note.id})">
          <span aria-hidden="true">×</span>
        </button>
      `;
      noteList.appendChild(li);
    });
}

function toggleNoteContent(element, noteId) {
  const noteContent = element.nextElementSibling;
  if (noteContent.style.display === 'none') {
    const formData = new FormData();
    formData.append('note_id', noteId);
    fetch('/note-content', {
      method: 'POST',
      body: formData
    })
      .then(response => response.text())
      .then(data => {
        noteContent.textContent = data;
        noteContent.style.display = 'block';
      });
  } else {
    noteContent.style.display = 'none';
  }
}

function deleteNote(noteId) {
  fetch('/delete-note', {
    method: 'DELETE',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ noteId })
  }).then(response => response.json())
    .then(data => {
      if (data.success) {
        location.reload();
      }
    });
}

</script>

{% endblock %}
