{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content%}

<div class="container my-5">

  <div class="row">
    <div class="col-md-6">
      <div class="container-fluid">
        <h1 class="display-5 fw-bold text-secondary">TTT</h1>
        <p class="col-md-8 fs-4">Learn quickly and achieve your goals.</p>
      </div>
    </div>

    <div class="col-md-6">
        <div class="p-5 bg-primary-subtle rounded-3">
          <form method="POST">
            <h3 align="center">Login</h3>

            <div class="form-group my-3">
              <label for="email">Email Address</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Enter email"
              />
            </div>
            <div class="form-group mt-3">
              <label for="password">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter password"
              />
            </div>
            <br />
            <button type="submit" class="btn btn-primary">Login</button>
          </form>

          <br />
          <label for="sign-up-button">Don't you have an account?</label>
          <br />
          <a href="/sign-up">
            <button
                    type="button"
                    class="btn btn-secondary my-3"
                    id="sign-up-button"
            >Sign up</button>
          </a>
        </div>
    </div>
  </div>
</div>

{% endblock %}
