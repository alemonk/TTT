{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content%}

<div class="hero-container m-1">
    <img
        src="{{ url_for('static', filename='images/note_writing.jpg') }}"
        class="hero-background rounded-3"
        alt="..."
    />

    <div class="hero-overlay rounded-3">
        <div class="p-5 bg-light-subtle rounded-2" style="width: 50%;">
            <form method="POST">
                <h3 align="center">Login</h3>

                <div class="form-floating mb-3">
                    <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                    >
                    <label for="email">Email address</label>
                </div>

                <div class="form-floating">
                    <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Password"
                    >
                    <label for="password">Password</label>
                </div>
                <br />
                <button
                        type="submit"
                        class="btn btn-light py-2 px-4 border-dark"
                >Login</button>
            </form>

            <br />
            <p>Don't you have an account?</p>
            <a href="/sign-up">
                <button
                        type="button"
                        class="btn btn-light py-2 px-4 border-dark"
                        id="sign-up-button"
                >Sign up</button>
            </a>
        </div>
    </div>
</div>

{% endblock %}
