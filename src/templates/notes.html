<!DOCTYPE html>
<html>
    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', filename='css/notes.css') }}"
    >

    <script defer
        type="text/javascript"
        src="{{ url_for('static', filename='js/notes.js') }}"
    ></script>
<head>
    <title>Notes</title>
</head>
<body>

{% extends "base.html" %}
{% block content %}

<h3 align="center">Notes</h3>
<br />

<div class="mb-3">
    <input type="file" id="formFileMultiple" multiple style="display: none;" onchange="handleFiles(this.files)">
    <button
            type="button"
            class="btn btn-secondary"
            onclick="document.getElementById('formFileMultiple').click()"
    >
        Choose Files
    </button>
    <br />
</div>

<br />

<div class="row row-cols-1 row-cols-md-4 g-4" id="notes">
    {% for note in user.notes|reverse %}
    <div class="col">
        <div class="card h-100 bg-primary-subtle rounded-5 p-3">
            <div class="card-body">
                <p class="card-text">This is a longer card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
            </div>
            <div class="note-title bg-light my-1" onclick="toggleNoteContent(this, {{ note.id }})">
                {{ note.title }}
            </div>
            <div class="note-content" style="display: none;">
            </div>
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-close mt-2" aria-label="Close" onclick="deleteNote({{ note.id }})">
                </button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}

</body>
</html>
