<!DOCTYPE html>
<html>
    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', filename='css/notes.css') }}"
    >

    <script defer
        type="text/javascript"
        src="{{ url_for('static', filename='js/notes.js') }}"
    ></script>
<head>
    <title>Notes</title>
</head>
<body>

{% extends "base.html" %}
{% block title %}Notes{% endblock %}
{% block content %}

<h3 align="center">Notes</h3>
<br />

<button
        type="button"
        class="btn btn-secondary mb-3"
        onclick="createFolder()"
>
    Create Folder
</button>

<br />

<!-- Display list of folders -->
{% for folder in user.folders %}

<div class="d-flex">
    <div
        class="folder-element bg-primary-subtle p-2 my-2 flex-grow-1 rounded-3 shadow-sm"
        data-bs-toggle="collapse"
        data-bs-target="#collapseFolder{{ folder.id }}"
        aria-expanded="false"
        aria-controls="collapseFolder{{ folder.id }}"
    >
        {{ folder.title }}
    </div>

    <!-- Wrap the two <i> elements and the switch button in a container with the flex-grow-1 class -->
    <div class="icon-container d-flex justify-content-center align-items-center">
        <div class="folder-element bg-primary-subtle my-1 flex-grow-1 ms-2 p-2 rounded-3 shadow-sm">
            <i class="bi bi-pen-fill"></i>
        </div>
        <div class="folder-element bg-primary-subtle my-1 flex-grow-1 ms-2 p-2 rounded-3 shadow-sm" onclick="deleteFolder({{ folder.id }})">
            <i class="bi bi-trash-fill" aria-label="Close"></i>
        </div>
    </div>
</div>

<div class="collapse" id="collapseFolder{{ folder.id }}">
    <!-- Display notes associated with the current folder -->
    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-4" id="notes">
        {% for note in folder.notes|reverse %}
        <div class="col">
            <div class="card bg-primary-subtle rounded-5 p-3 shadow">
                <!--
                <img
                    src="{{ url_for('static', filename='icons/TTT_icon.jpg') }}"
                    class="card-img-top rounded-3 mb-2"
                    alt="..."
                >
                 -->

                <div class="rounded-3 p-2 bg-light mb-2">
                    {{ note.title }}
                </div>

                <div class="icon-container d-flex justify-content-center align-items-center">
                    <!-- quick test -->
                    <div class="dropdown">
                        <div
                                class="note-element bg-light d-flex justify-content-end ms-2"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                        >
                            <i class="bi bi-card-list" aria-label="Close"></i>
                        </div>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="quick_test" onclick="quickTest()">Create quick test</a></li>
                        </ul>
                    </div>

                    <!-- more options -->
                    <div class="dropdown">
                        <div
                                class="note-element bg-light d-flex justify-content-end ms-2"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                        >
                            <i class="bi bi-three-dots-vertical" aria-label="Close"></i>
                        </div>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Rename note</a></li>
                            <li><a class="dropdown-item" onclick="deleteNote({{ note.id }})" href="#">Delete note</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Add "Add File" button to each folder -->
    <div class="mb-3">
        <input type="file" id="formFileMultiple{{ folder.id }}" multiple style="display: none;" onchange="handleFiles(this.files, {{ folder.id }})">
        <button
                type="button"
                class="btn btn-secondary my-4"
                onclick="document.getElementById('formFileMultiple{{ folder.id }}').click()"
        >
            Add file
        </button>
        <br />
    </div>
</div>

{% endfor %}

{% endblock %}

</body>
</html>
