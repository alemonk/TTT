<!DOCTYPE html>
<html>
    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', filename='css/history.css') }}"
    >

    <script defer
        type="text/javascript"
        src="{{ url_for('static', filename='js/history.js') }}"
    ></script>
<head>
    <title>History</title>
</head>
<body>

{% extends "base.html" %}
{% block content %}

<h3 align="center">History</h3>

<br />

<ul class="list-group list-group-flush" id="tests">
    {% if user.tests|length == 0 %}
        <li class="list-group-item bg-light">
            <div class="bg-warning-subtle p-2 rounded-3" style="display: inline-block;">
                No tests saved.
            </div>
        </li>
    {% else %}
        {% for test in user.tests|reverse %}
            <li class="list-group-item rounded-3 mb-3 bg-primary-subtle">
            <!-- Use a div element with the d-flex class to create a flexbox container -->
            <div class="d-flex">
              <!-- Use the flex-grow-1 class to make the test-title element grow and fill the available space -->
              <div class="test-title bg-light my-1 flex-grow-1" onclick="showTest(this, {{ test.id }})">
                {{ test.title }}
              </div>
              <!-- Use the ms-auto class to move the delete test button to the right end of the flexbox container -->
              <button type="button" class="btn btn-close m-2" aria-label="Close" onclick="deleteTest({{ test.id }})">
              </button>
            </div>
            <!-- This is where the test data will be displayed -->
            <div class="test-data" style="display: none;" id="test-data-{{ test.id }}">
            </div>
          </li>
        {% endfor %}
    {% endif %}
</ul>

{% endblock %}

</body>
</html>
